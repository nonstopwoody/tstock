name: Daily Stock Analysis

# Schedule: 11:00 Bangkok time = 04:00 UTC, Monday-Friday
# (GitHub Actions cron always uses UTC; +7 hours = BKK)
on:
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:  # allow manual runs from Actions tab

permissions:
  contents: write  # needed so the workflow can commit signals.json back

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENTIMENT_BACKEND: keyword
          PYTHONIOENCODING: utf-8
        run: python pipeline.py --mode pre_market

      - name: Commit signals.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: pipeline run at $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Send Telegram notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://nonstopwoody.github.io/tstock/dashboard.html
        run: python notify_telegram.py
